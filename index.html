<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5b800">
<title>Pressespiegel-Versender</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #fafaf7; color: #1a1a1a; min-height: 100vh;
  }
  .app {
    max-width: 720px; margin: 0 auto; padding: 60px 24px 40px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.01em; }
  p { color: #555; font-size: 15px; line-height: 1.6; margin: 8px 0; }
  .btn {
    margin-top: 24px;
    padding: 16px 28px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer;
    background: #f5b800; color: #1a1a1a;
    display: inline-block; text-decoration: none;
  }
  .btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="app">
  <h1>📰 Pressespiegel-Versender</h1>
  <p>Der E-Mail-Entwurf wird automatisch geöffnet …</p>
  <p>Falls sich nichts öffnet:</p>
  <button class="btn" id="mailBtn">✉️ E-Mail-Entwurf öffnen</button>
</div>

<script>
(function() {
  'use strict';

  const MONATE = ['Januar','Februar','März','April','Mai','Juni',
                  'Juli','August','September','Oktober','November','Dezember'];
  const today  = new Date();
  const dateDE = `${today.getDate()}. ${MONATE[today.getMonth()]} ${today.getFullYear()}`;

  const RECIPIENTS = [
    'ulrich.thoden@bundestag.de',
    'ulrich.thoden.ma02@bundestag.de',
    'ulrich.thoden.ma03@bundestag.de',
    'ulrich.thoden.ma01@bundestag.de',
    'ulrich.thoden.ma04@bundestag.de',
    'ulrich.thoden.ma70@bundestag.de',
    'axel.gehring@dielinkebt.de'
  ];

  function buildMailto() {
    const subject = `Pressespiegel ${dateDE}`;
    const body = `Guten Morgen ihr lieben,\n\nanbei schicke ich euch den heutigen Pressespiegel.\nIch wünsche euch einen tollen Tag!\n\nLiebe Grüße\nRaphael`;
    const to = RECIPIENTS.join(',');
    return `mailto:${to}` +
           `?subject=${encodeURIComponent(subject)}` +
           `&body=${encodeURIComponent(body)}`;
  }

  function openMail() {
    window.location.href = buildMailto();
  }

  document.getElementById('mailBtn').addEventListener('click', openMail);

  // Beim Öffnen der App sofort den E-Mail-Entwurf erzeugen
  openMail();
})();
</script>

</body>
</html>
